name: Build ImmortalWrt for JDCloud RE-SS-01

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'åºä»¶çæ¬æ ç­¾ï¼çç©ºåèªå¨çææ¥æï¼'
        required: false
        default: ''
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build.yml'
      - 'config/jdcloud_re-ss-01.config'
      - 'files/**'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master
  DEVICE_PROFILE: jdcloud_re-ss-01
  TARGET: qualcommax
  SUBTARGET: ipq60xx

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: å®è£ç¼è¯ä¾èµ
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync unzip \
            zlib1g-dev swig libpython3-dev
          sudo apt-get clean

      - name: åé ImmortalWrt æºç 
        run: |
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          cd openwrt
          git --no-pager log -1 --oneline

      - name: æ·»å  iStore Feedï¼luci-app-storeï¼
        run: |
          cd openwrt
          cp feeds.conf.default feeds.conf
          echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf
          cat feeds.conf

      - name: æ´æ°å¹¶å®è£ Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo '==== å¼ºå¶å®è£ iStore ç luci-app-store ===='
          ./scripts/feeds install -p istore luci-app-store 2>&1 | tail -10 || true
          ls package/feeds/istore/ 2>/dev/null || true

      - name: åºç¨è®¾å¤éç½®
        run: |
          cd openwrt
          cp ../config/jdcloud_re-ss-01.config .config
          make defconfig
          echo '==== éªè¯ luci-app-store æ¯å¦è¢« defconfig ä¿ç ===='
          grep -q 'CONFIG_PACKAGE_luci-app-store=y' .config && echo STORE_OK || echo STORE_MISSING_IN_CONFIG

      - name: ä¿®è¡¥ libffi fficonfig.h å®è£è·¯å¾ï¼å¼å®¹æå»ºç®å½åï¼
        run: |
          cd openwrt
          F=package/libs/libffi/Makefile
          grep -n fficonfig.h "$F" || true
          sed -i 's#\$(PKG_BUILD_DIR)/\$(GNU_TARGET_NAME)\*/fficonfig.h#$(PKG_BUILD_DIR)/*/fficonfig.h#' "$F"
          echo "==== patched fficonfig.h line ===="
          grep -n fficonfig.h "$F"

      - name: ä¸º RE-SS-01 è¡¥å factory.bin çæè§åï¼æ¯æåå/é¦æ¬¡ U-Boot Web å·æºï¼
        run: |
          cd openwrt
          F=target/linux/qualcommax/image/ipq60xx.mk
          python3 - <<'PY'
          import io
          p="target/linux/qualcommax/image/ipq60xx.mk"
          t=io.open(p,encoding="utf-8").read()
          marker="define Device/jdcloud_re-ss-01"
          end="endef"
          i=t.find(marker)
          assert i>=0, "device block not found: "+marker
          j=t.find(end, i)
          assert j>=0, "endef not found after "+marker
          block=t[i:j]
          if "IMAGE/factory.bin" not in block:
              insert="\t$(call Device/EmmcImage)\n\tIMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-rootfs | append-metadata\n"
              t=t[:j]+insert+t[j:]
              io.open(p,"w",encoding="utf-8",newline="\n").write(t)
              print("inserted factory rule for jdcloud_re-ss-01")
          else:
              print("factory rule already in jdcloud block")
          PY
          echo "==== RE-SS-01 device block after patch ===="
          awk '/define Device\/jdcloud_re-ss-01/,/endef/' "$F"

      - name: å¤å¶ä»åºèªå®ä¹éç½®å°æºç æ  filesï¼é¿åä¸ kmod FILES åéå²çªï¼
        run: |
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          find openwrt/files -type f | sort

      - name: é¢è®¾é»è®¤å¯ç  admin
        run: |
          mkdir -p openwrt/files/etc
          HASH=$(openssl passwd -1 admin)
          echo "root:$HASH:0:0:99999:7:::" > openwrt/files/etc/shadow
          cat openwrt/files/etc/shadow

      - name: ä¸è½½ææç¼è¯å
        run: |
          cd openwrt
          make download -j8
          make download -j1 || true

      - name: å¼å§ç¼è¯åºä»¶
        run: |
          cd openwrt
          nproc
          make -j$(nproc) V=s || make -j1 V=s

      - name: ååºç¼è¯äº§ç©
        run: |
          cd openwrt
          ls -lh bin/targets/qualcommax/ipq60xx/ || true
          find bin/targets/qualcommax/ipq60xx/ -name "*.bin" -o -name "*.img" | head -20
          if ls bin/targets/qualcommax/ipq60xx/*factory.bin >/dev/null 2>&1; then
            echo "== FACTORY_BIN OK =="
          else
            echo "== FACTORY_BIN MISSING =="
          fi

      - name: ä¸ä¼ åºä»¶ä¸º Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-jdcloud-re-ss-01
          path: openwrt/bin/targets/qualcommax/ipq60xx/*
          retention-days: 30

      - name: åå¸å° GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version != '' && github.event.inputs.version || format('ss01-{0}', github.run_number) }}
          name: JDCloud RE-SS-01 åºä»¶ ${{ github.run_number }}
          files: |
            openwrt/bin/targets/qualcommax/ipq60xx/*.bin
            openwrt/bin/targets/qualcommax/ipq60xx/*.img
          body: |
            ## äº¬ä¸äº RE-SS-01 èªå®ä¹åºä»¶
            - Target: qualcommax/ipq60xx
            - Device: JDCloud RE-SS-01
            - åå« iStore åºç¨ååº (luci-app-store)
            - é»è®¤ IP: 192.168.12.1
            - é»è®¤è´¦å·: root / admin
            - ç¼è¯ commit: ${{ github.sha }}
          draft: false
          prerelease: false
